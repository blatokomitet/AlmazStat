name: Migrate Sportmonks Match Centre

on:
  push:
    branches:
      - main
    paths:
      - scripts/migrate-sportmonks-match-centre.py
      - .github/workflows/migrate-sportmonks-match-centre.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server
        run: python3 scripts/migrate-sportmonks-match-centre.py

      - name: Validate
        run: |
          node --check server.js
          node --check lib/sportmonks-provider.js

      - name: Commit patched server
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Migrate Match Centre routes to Sportmonks"
          git push
