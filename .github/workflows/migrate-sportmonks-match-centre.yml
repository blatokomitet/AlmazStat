name: Migrate Sportmonks Match Centre

on:
  push:
    branches:
      - main
    paths:
      - scripts/phase3-frontend.py
      - .github/workflows/migrate-sportmonks-match-centre.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend
        run: python3 scripts/phase3-frontend.py

      - name: Validate
        run: |
          node --check app.js
          node --check server.js
          node --check lib/sportmonks-provider.js

      - name: Commit Phase 3 frontend
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js
          git commit -m "Phase 3: add RU EN switch and clean match frontend"
          git push
