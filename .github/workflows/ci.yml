name: CI

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "server.js"
      - "lib/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app.js"
      - "server.js"
      - "lib/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run contract tests
        run: npm test
