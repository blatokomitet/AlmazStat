name: Wire Sportmonks provider

on:
  push:
    branches:
      - feat/sportmonks-provider-pass-1
    paths:
      - .github/scripts/wire-sportmonks.mjs
      - .github/workflows/wire-sportmonks.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sportmonks-provider-pass-1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded patch
        run: node .github/scripts/wire-sportmonks.mjs
      - name: Validate server syntax
        run: node --check server.js
      - name: Validate provider syntax
        run: node --check lib/sportmonks-provider.js
      - name: Validate diff
        run: git diff --check
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Wire Sportmonks into match routes"
          git push origin HEAD:feat/sportmonks-provider-pass-1
