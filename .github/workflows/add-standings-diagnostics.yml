name: Add standings diagnostics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-standings-diagnostics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch safe standings diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          needle='app.get("/api/match/:fixture/standings", async (request, response) => {'
          if 'app.get("/api/debug/standings/:fixture"' not in s:
              diagnostic=r'''app.get("/api/debug/standings/:fixture", async (request, response) => {
  const fixtureId = String(request.params.fixture || "").trim();
  const diagnostic = {
    fixtureId,
    sportmonksConfigured: Boolean(sportmonksToken),
    seasonId: null,
    home: null,
    away: null,
    upstream: { ok: false, status: null, rowCount: null, includeMode: null, error: null },
  };

  if (!sportmonksToken) {
    return response.status(503).json({ ...diagnostic, upstream: { ...diagnostic.upstream, error: "SPORTMONKS_NOT_CONFIGURED" } });
  }

  try {
    const centre = await getSportmonksMatchCentre(fixtureId);
    diagnostic.seasonId = centre?.league?.season ?? null;
    diagnostic.home = centre?.home ? { id: centre.home.id ?? null, name: centre.home.name ?? null } : null;
    diagnostic.away = centre?.away ? { id: centre.away.id ?? null, name: centre.away.name ?? null } : null;
    if (!diagnostic.seasonId) {
      return response.status(404).json({ ...diagnostic, upstream: { ...diagnostic.upstream, error: "SEASON_ID_MISSING" } });
    }

    const table = await sportmonksProvider.standingsBySeason(diagnostic.seasonId);
    const rows = Array.isArray(table?.standings) ? table.standings : [];
    const homeRow = rows.find((row) => Number(row?.team?.id) === Number(diagnostic.home?.id)) || null;
    const awayRow = rows.find((row) => Number(row?.team?.id) === Number(diagnostic.away?.id)) || null;
    diagnostic.upstream = {
      ok: true,
      status: 200,
      rowCount: rows.length,
      includeMode: table?.meta?.includeMode ?? null,
      error: null,
    };
    diagnostic.matches = { home: Boolean(homeRow), away: Boolean(awayRow) };
    diagnostic.sample = rows.slice(0, 3).map((row) => ({ rank: row?.rank ?? null, teamId: row?.team?.id ?? null, teamName: row?.team?.name ?? null, points: row?.points ?? null }));
    return response.json(diagnostic);
  } catch (error) {
    diagnostic.upstream = {
      ok: false,
      status: Number(error?.status) || null,
      rowCount: null,
      includeMode: null,
      error: String(error?.message || error || "UNKNOWN_ERROR").slice(0, 300),
    };
    return response.status(502).json(diagnostic);
  }
});

'''
              if needle not in s: raise SystemExit('standings route marker not found')
              s=s.replace(needle, diagnostic+needle, 1)
              p.write_text(s)
          PY
          node --check server.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "debug: expose safe Sportmonks standings diagnostics"
          git push
