name: Sportmonks Team Recent Form fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase3-frontend.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply form include fix
        run: node .github/scripts/fix-sportmonks-form-includes.mjs
      - name: Validate
        run: |
          node --check lib/sportmonks-provider.js
          node --check server.js
          node --check app.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sportmonks-provider.js
          git commit -m "fix: simplify Sportmonks recent form request"
          git push
