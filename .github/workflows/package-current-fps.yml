name: Package current AlmazStat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-current-fps.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project
        run: |
          node --check server.js
          node --check app.js
          node --check lib/sportmonks-provider.js
      - name: Create snapshot archive
        run: |
          rm -rf .git node_modules
          zip -r AlmazStat-current.zip . -x 'AlmazStat-current.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: AlmazStat-current
          path: AlmazStat-current.zip
          retention-days: 7
