name: Show all live matches on dashboard
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/show-all-live-dashboard.yml
      - .github/scripts/show-all-live-dashboard.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch dashboard
        run: node .github/scripts/show-all-live-dashboard.mjs
      - name: Validate
        run: node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show all live matches on home dashboard"
          git push
